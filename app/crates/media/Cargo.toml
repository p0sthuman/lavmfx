[package]
name = "lavmfx-media"
description = "Media decoding (ffmpeg, from M1), frame cache, GPU upload"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ffmpeg-next = "9.1"
libloading = "0.8"
log.workspace = true
snap = "1.1.2"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_44"] } # PipeWire ≥ 0.3.44 (2022): target.object, trigger_process

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [ # Spout: Direct3D 11 shared textures (MIT / Apache-2.0)
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
